<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Beluga Restaurant</title>
    <script>
      // Redirect to the main page with the current path
      const path = window.location.pathname;
      window.location.href = '/beluga-restaurant' + 
        (path.startsWith('/beluga-restaurant/') ? path.replace('/beluga-restaurant', '') : '');
    </script>
  </head>
  <body>
    <p>Redirecting to Beluga Restaurant...</p>
  </body>
</html>
